<style>
  :root{
    --rail:#16302b; --rail-tx:#cfe0db; --rail-act:#2a5a50;
    --bg:#eef2f0; --card:#ffffff; --tx:#16201d; --mut:#5d6a66; --line:#d8e0dd; --soft:#f5f8f7;
    --ent:#1d7f47; --sai:#bf3b2a; --pri:#1f6f5c; --warn:#a86a00; --warn-bg:#fff4dc; --on:#ffffff;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){:root{
    --rail:#0c1714; --rail-act:#1f4740;
    --bg:#111614; --card:#1a201e; --tx:#e8eeeb; --mut:#95a19d; --line:#2b3431; --soft:#151b19;
    --ent:#2fa463; --sai:#e0604d; --pri:#2b8a73; --warn:#f0b54a; --warn-bg:#2a2210; color-scheme:dark}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--rail)}
  body{margin:0;position:fixed;top:0;left:0;right:0;height:var(--apph,100%);overflow:hidden;display:flex;flex-direction:column;background:var(--rail);color:var(--tx);font-family:var(--font);font-size:16px;padding-top:env(safe-area-inset-top,0px)}
  nav{flex:none;position:relative;z-index:5;background:var(--rail);color:var(--rail-tx);
    padding:10px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px))}
  .brand{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:800;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:#fff;padding:0 4px 8px}
  .brand small{font-weight:600;letter-spacing:0;text-transform:none;color:#fff;font-size:16px;font-variant-numeric:tabular-nums}
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tab{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:var(--rail-tx);
    font:inherit;font-size:13px;font-weight:600;padding:9px 4px;border-radius:10px;position:relative;line-height:1.15;text-align:center;min-width:0}
  .tab svg{width:18px;height:18px;flex:none}
  .tab[aria-selected="true"]{background:var(--rail-act);color:#fff}
  .badge{background:var(--sai);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;flex:none}
  @media (max-width:380px){ .tab svg{display:none} }
  @media (min-width:700px){ .brand,.tabs{max-width:560px} }
  main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);padding:14px max(10px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  .view{max-width:560px;display:flex;flex-direction:column;gap:14px}
  .view[hidden],[hidden]{display:none!important}
  h1{margin:0;font-size:22px;letter-spacing:-.01em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
  label{font-size:11px;color:var(--mut);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
  label[data-t]::before{content:attr(data-t)}
  input{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--tx);min-width:0}
  input.code{font-family:var(--mono);text-transform:uppercase}
  input:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
  input[type=search]{-webkit-appearance:none;appearance:none}
  input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  @media (min-width:700px){.grid2{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}}
  .big{border:0;border-radius:12px;padding:16px 10px;font:inherit;font-size:17px;font-weight:700;color:var(--on);width:100%}
  .pri{background:var(--pri)}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px;font:inherit;font-size:15px;width:100%}
  .danger{background:transparent;border:1px solid var(--sai);color:var(--sai);border-radius:10px;padding:11px;font:inherit;font-size:15px;font-weight:600;width:100%}
  .danger.sure{background:var(--sai);color:var(--on)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  li:first-child{border-top:0}
  .delta{flex:none;min-width:58px;text-align:center;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;padding:6px 8px;border-radius:10px}
  .delta.p{color:var(--ent);background:color-mix(in srgb,var(--ent) 13%,transparent)}
  .delta.n{color:var(--sai);background:color-mix(in srgb,var(--sai) 13%,transparent)}
  .delta.z{color:var(--mut);background:var(--soft)}
  .nm{flex:1;min-width:0}
  .nm b{display:block;overflow-wrap:anywhere;font-weight:600;line-height:1.3}
  .nm span{font-size:12px;color:var(--mut)}
  .nm code{font-family:var(--mono);font-size:12px;color:var(--mut)}
  .hist{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .hc{font-size:12px;color:var(--mut);background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:3px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hc b{font-weight:800;margin-right:2px}
  .hc.p b{color:var(--ent)} .hc.n b{color:var(--sai)}
  .lanc{display:flex;gap:10px;align-items:flex-end;margin-top:14px}
  .lanc .big{flex:none;width:auto;padding:13px 22px}
  input.num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  input::placeholder{color:var(--mut);opacity:.7;font-weight:500}
  input.num::placeholder{font-size:17px}
  code.cc{font-family:var(--mono);font-size:13px;font-weight:600;background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri);padding:2px 7px;border-radius:6px}
  .clr{position:relative}
  .clr input{padding-right:40px;padding-left:10px}
  .xbtn{position:absolute;top:50%;right:4px;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--mut);font-size:22px;line-height:1;display:grid;place-items:center}
  .xbtn:active{background:var(--line)}
  .empty{color:var(--mut);font-size:14px;text-align:center;padding:14px 0}
  .sug{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .opt{display:flex;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-size:15px;padding:11px 12px;text-align:left}
  .opt:first-child{border-top:0}
  .opt.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--pri)}
  .opt code{font-family:var(--mono);font-size:13px;font-weight:600;background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri);padding:2px 7px;border-radius:6px;flex:none}
  .opt span{min-width:0;overflow-wrap:anywhere;line-height:1.3}
  .opt mark{background:transparent;color:inherit;font-weight:800}
  .aj{flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--tx);font-size:18px;font-weight:700;display:grid;place-items:center}
  .aj[aria-expanded="true"]{background:var(--pri);border-color:var(--pri);color:var(--on)}
  li.ajuste{display:flex;flex-wrap:wrap;gap:8px;border-top:0;padding:0 0 12px}
  li.ajuste .big, li.ajuste .danger{flex:1;padding:12px 8px;font-size:15px}
  .confirm{border:2px solid var(--pri)}
  .confirm p{margin:0 0 12px}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .day{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600}
  .day.on{background:var(--pri);border-color:var(--pri);color:var(--on)}
  .aviso{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
  textarea{width:100%;min-height:120px;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--tx)}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.on{opacity:1}
</style>

<div class="toast" id="toast" role="status"></div>

<script>
const K = 'armazem_v2';
let st = {mov: [], cat: {}};
try { const s = localStorage.getItem(K); if (s) { const p = JSON.parse(s); if (p && Array.isArray(p.mov)) st = Object.assign(st, p); } } catch(e) {}
const PADRAO = {
  '0114.003179': 'Disjuntor Bipolar 2P 50A 440V',
  '0114.003178': 'Disjuntor Bipolar 2P 32A 440V',
};
if (!st.semeado){ Object.keys(PADRAO).forEach(c=>{ if (!st.cat[c]) st.cat[c] = PADRAO[c]; }); st.semeado = true; }
function salvar(){ const cc=document.getElementById('copiaCard'); if (cc) cc.hidden = true; try { localStorage.setItem(K, JSON.stringify(st)); } catch(e) { toast('Não consegui salvar no aparelho'); } }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dataCurta = t => new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const hora = t => new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const pad = n => String(n).padStart(2,'0');
const diaDe = t => { const d=new Date(t); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const hoje = () => diaDe(Date.now());
function nomeDia(k){
  const h = hoje(), d = new Date(); d.setDate(d.getDate()-1);
  if (k===h) return 'Hoje';
  if (k===diaDe(d)) return 'Ontem';
  const [y,m,dd] = k.split('-'); return new Date(+y,+m-1,+dd).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
}
function dataLonga(k){ const [y,m,d] = k.split('-'); const M=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']; return d+' '+M[+m-1]+' '+y; }

let tt;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1600); }

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x===b));
  document.querySelectorAll('.view').forEach(v=>v.hidden = v.id!==b.dataset.view);
  document.querySelector('main').scrollTop = 0;
});

const chave = (cod,nome) => cod ? 'c:'+cod.toUpperCase() : 'n:'+nome.toLowerCase();
const rotulo = (cod,nome) => nome || cod;
const norm = v => String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

function resolver(cod, nome){
  cod = (cod||'').trim().toUpperCase(); nome = (nome||'').trim();
  if (cod && !nome && st.cat[cod]) nome = st.cat[cod];
  if (nome && !cod){
    const c = Object.keys(st.cat).find(k=>norm(st.cat[k])===norm(nome));
    if (c){ cod = c; nome = st.cat[c]; }
  }
  return {cod, nome};
}

function catalogo(){
  const m = {};
  Object.keys(st.cat).forEach(c=>{ m['c:'+c] = {cod:c, nome:st.cat[c], uso:0}; });
  st.mov.forEach(x=>{
    const r = resolver(x.cod, x.nome), k = r.cod ? 'c:'+r.cod : 'n:'+norm(r.nome);
    m[k] = m[k] || {cod:r.cod, nome:r.nome, uso:0}; m[k].uso++;
  });
  return Object.values(m);
}

const SINONIMOS = [['bipolar','2p'],['tripolar','3p'],['monopolar','unipolar','1p'],['tetrapolar','4p'],['v','volts','volt'],['a','amperes','amper']];
function variantes(t){ const g = SINONIMOS.find(g=>g.includes(t)); return g ? g : [t]; }
function buscar(q){
  const n = norm(q); if (!n) return [];
  const toks = n.split(/\s+/);
  return catalogo().map(it=>{
    const c = norm(it.cod), nm = norm(it.nome), pal = nm.split(/\s+/);
    let p = 0;
    if (c && c===n) p = 100;
    else if (c && c.startsWith(n)) p = 80;
    else if (nm.startsWith(n)) p = 70;
    else if (toks.every(t=>variantes(t).some(v=>pal.some(w=>w.startsWith(v))) || (c && c.startsWith(t)))) p = 50;
    else if (toks.every(t=>variantes(t).some(v=>nm.includes(v)) || (c && c.includes(t)))) p = 30;
    return {it, p};
  }).filter(x=>x.p).sort((a,b)=>b.p-a.p || b.it.uso-a.it.uso).slice(0,6).map(x=>x.it);
}

function destacar(txt, q){
  const n = norm(q); if (!n) return esc(txt);
  const toks = n.split(/\s+/).filter(Boolean);
  return String(txt).split(/(\s+)/).map(w=>{
    const t = toks.find(t=>norm(w).startsWith(t));
    return t ? '<mark>'+esc(w.slice(0,t.length))+'</mark>'+esc(w.slice(t.length)) : esc(w);
  }).join('');
}

function autocompletar(codEl, nomeEl, box){
  let res = [], ativo = 0;
  function mostrar(el){
    res = buscar(el.value);
    if (res.length===1 && norm(res[0].cod)===norm(codEl.value) && norm(res[0].nome)===norm(nomeEl.value)) res = [];
    if (!res.length){ box.hidden = true; return; }
    ativo = 0; desenhar(el.value); box.hidden = false;
  }
  function desenhar(q){
    box.innerHTML = res.map((it,i)=>`<button type="button" class="opt ${i===ativo?'on':''}" data-i="${i}">${it.cod?'<code>'+esc(it.cod)+'</code>':''}<span>${it.nome?destacar(it.nome,q):'<em style="color:var(--mut)">sem nome</em>'}</span></button>`).join('');
  }
  function escolher(i){
    const it = res[i]; if (!it) return;
    codEl.value = it.cod; nomeEl.value = it.nome;
    box.hidden = true; res = [];
  }
  [codEl, nomeEl].forEach(el=>{
    el.addEventListener('input', ()=>mostrar(el));
    el.addEventListener('focus', ()=>{ if (el.value) mostrar(el); });
    el.addEventListener('keydown', e=>{
      if (box.hidden || !res.length) return;
      if (e.key==='Tab' || e.key==='Enter'){ e.preventDefault(); escolher(ativo); }
      else if (e.key==='ArrowDown'){ e.preventDefault(); ativo=(ativo+1)%res.length; desenhar(el.value); }
      else if (e.key==='ArrowUp'){ e.preventDefault(); ativo=(ativo-1+res.length)%res.length; desenhar(el.value); }
      else if (e.key==='Escape'){ box.hidden = true; }
    });
    el.addEventListener('blur', ()=>setTimeout(()=>{
      if (document.activeElement!==codEl && document.activeElement!==nomeEl) box.hidden = true;
    }, 120));
  });
  box.addEventListener('pointerdown', e=>{ const b=e.target.closest('.opt'); if(!b) return; e.preventDefault(); escolher(+b.dataset.i); });
  return ()=>{ box.hidden = true; res = []; };
}
const fecharSugMain = autocompletar($('cod'), $('fItem'), $('sugMain'));

function atualizaX(){ document.querySelectorAll('[data-limpa]').forEach(b=>{ b.hidden = !$(b.dataset.limpa).value; }); }
['cod','fItem'].forEach(id=>$(id).addEventListener('input', atualizaX));
document.querySelectorAll('[data-limpa]').forEach(b=>{
  b.addEventListener('pointerdown', e=>e.preventDefault());
  b.addEventListener('click', ()=>{ const el=$(b.dataset.limpa); el.value=''; fecharSugMain(); atualizaX(); el.focus({preventScroll:true}); });
});
setInterval(atualizaX, 400);

function diasAbertos(){ return [...new Set(st.mov.map(x=>diaDe(x.t)))].sort().reverse(); }
let diaSel = null;
function diaAtual(){
  const ds = diasAbertos();
  if (diaSel && ds.includes(diaSel)) return diaSel;
  return ds.includes(hoje()) ? hoje() : (ds[0] || hoje());
}

function agrupar(dia){
  const m = {};
  st.mov.filter(x=>diaDe(x.t)===dia).forEach(x=>{
    const r = resolver(x.cod,x.nome), k = chave(r.cod,r.nome);
    m[k] = m[k] || {k, cod:r.cod, nome:r.nome, saldo:0, e:0, s:0, movs:[]};
    m[k].movs.push(x);
    if (r.nome && !m[k].nome) m[k].nome = r.nome;
    if (x.tipo==='e'){ m[k].saldo += x.q; m[k].e += x.q; } else { m[k].saldo -= x.q; m[k].s += x.q; }
  });
  return Object.values(m).sort((a,b)=>rotulo(a.cod,a.nome).localeCompare(rotulo(b.cod,b.nome)));
}
const faltam = dia => agrupar(dia).filter(i=>i.saldo!==0).length;

let abertoK = null, ajQtd = 0, apagarItem = false;
const LAPIS = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';

function render(){
  { const d=new Date(), M=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']; $('hojeCurto').textContent = String(d.getDate()).padStart(2,'0')+' '+M[d.getMonth()]+' '+d.getFullYear(); }

  const ds = diasAbertos();
  const dia = diaAtual();
  const antigos = ds.filter(d=>d!==hoje());
  $('aviso').hidden = !antigos.length;
  if (antigos.length) $('aviso').textContent = antigos.length===1
    ? `${nomeDia(antigos[0])} ainda não foi limpo.`
    : `${antigos.length} dias anteriores ainda não foram limpos.`;
  $('days').hidden = ds.length < 2;
  $('days').innerHTML = ds.map(d=>`<button class="day ${d===dia?'on':''}" data-d="${d}">${nomeDia(d)}</button>`).join('');
  $('altDia').textContent = nomeDia(dia) + ' · ' + dataLonga(dia);

  const g = agrupar(dia);
  $('alteracoes').innerHTML = g.length ? g.map(i=>{
    const cls = i.saldo>0?'p':i.saldo<0?'n':'z';
    const txt = i.saldo>0?'+'+i.saldo:i.saldo<0?'−'+Math.abs(i.saldo):'0';
    const det = [i.cod?'<code>'+esc(i.cod)+'</code>':'', `entrou ${i.e} · saiu ${i.s}`].filter(Boolean).join(' · ');
    const aberto = abertoK===i.k;
    return `<li><span class="delta ${cls}">${txt}</span>
      <div class="nm"><b>${esc(rotulo(i.cod,i.nome))}</b><span>${det}</span>
        <div class="hist">${i.movs.slice().sort((a,b)=>a.t-b.t).map(x=>`<span class="hc ${x.tipo==='e'?'p':'n'}"><b>${x.tipo==='e'?'+':'−'}${x.q}</b> ${x.aj?'ajuste ':''}${dataCurta(x.t)} ${hora(x.t)}</span>`).join('')}</div></div>
      <button class="aj" data-aj="${esc(i.k)}" aria-expanded="${aberto}" aria-label="Alterar ou apagar este item">${aberto?'×':LAPIS}</button></li>`
      + (aberto ? `<li class="ajuste">
        <input id="ajQtd" type="search" inputmode="text" autocomplete="off" enterkeyhint="done" class="num" aria-label="Quantidade" value="${fmt(ajQtd)}" style="flex:1 1 100%">
        <button class="danger ${apagarItem?'sure':''}" data-apagar>${apagarItem?'Toque de novo':'Apagar item'}</button>
        <button class="big pri" data-salvar>Salvar</button></li>` : '');
  }).join('') : '<div class="empty">Nada mudou hoje.</div>';

  const total = ds.reduce((s,d)=>s+faltam(d),0);
  $('badge').textContent = total; $('badge').hidden = !total;
  renderItens();
}

function lerQtd(v){
  v = String(v).replace(/\s/g,'').replace('−','-');
  if (!/^[+-]?\d+$/.test(v)) return null;
  const n = parseInt(v,10); if (!n) return null;
  return {tipo: n<0?'s':'e', q: Math.abs(n)};
}
const fmt = n => { n = Number(n)||0; return n>0 ? '+'+n : String(n); };
function lancar(){
  const {cod, nome} = resolver($('cod').value, $('fItem').value);
  if (!cod && !nome){ toast('Preencha o codigo ou o nome'); return; }
  const lq = lerQtd($('qtd').value);
  if (!lq){ toast('Digite a quantidade, tipo +5 ou -2'); return; }
  const {tipo, q} = lq;
  if (cod && nome) st.cat[cod] = nome;
  const t = Date.now();
  st.mov.push({id:String(t)+Math.floor(Math.random()*1000), cod, nome, q, tipo, t});
  salvar(); render();
  $('cod').value=''; $('fItem').value=''; $('qtd').value=''; fecharSugMain();
  toast((tipo==='e'?'+':'−')+q+' '+rotulo(cod,nome));
}
$('btnLancar').onclick = lancar;
$('qtd').addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); lancar(); } });

$('days').onclick = e=>{ const b=e.target.closest('.day'); if(!b) return; diaSel=b.dataset.d; abertoK=null; $('copiaCard').hidden=true; render(); };
$('alteracoes').onclick = e=>{
  const dia = diaAtual();
  const aj = e.target.closest('[data-aj]');
  if (aj){
    abertoK = abertoK===aj.dataset.aj ? null : aj.dataset.aj; apagarItem = false;
    const it = agrupar(dia).find(i=>i.k===abertoK); ajQtd = it ? it.saldo : 0;
    render(); if (abertoK){ const el=$('ajQtd'); el.focus({preventScroll:true}); el.select(); }
    return;
  }
  const item = agrupar(dia).find(i=>i.k===abertoK); if (!item) return;
  if (e.target.closest('[data-salvar]')){
    const v = $('ajQtd').value.replace(/\s/g,'').replace('−','-');
    if (!/^[+-]?\d+$/.test(v)){ toast('Digite um número, tipo +5 ou -2'); return; }
    const n = parseInt(v,10);
    const dif = n - item.saldo;
    if (dif){
      let t = Date.now();
      if (dia!==hoje()){ const [y,m,d]=dia.split('-'); t = new Date(+y,+m-1,+d,23,59).getTime(); }
      st.mov.push({id:String(Date.now())+Math.floor(Math.random()*1000), cod:item.cod, nome:item.nome, q:Math.abs(dif), tipo:dif>0?'e':'s', t, aj:true});
    }
    abertoK = null; salvar(); render(); toast('Quantidade alterada');
    return;
  }
  if (e.target.closest('[data-apagar]')){
    if (!apagarItem){ apagarItem = true; render(); return; }
    const ids = new Set(item.movs.map(x=>x.id));
    st.mov = st.mov.filter(x=>!ids.has(x.id));
    abertoK = null; apagarItem = false; salvar(); render(); toast('Item apagado');
  }
};
$('alteracoes').addEventListener('input', e=>{ if (e.target.id==='ajQtd') ajQtd = e.target.value; });
$('alteracoes').addEventListener('keydown', e=>{ if (e.target.id==='ajQtd' && e.key==='Enter'){ e.preventDefault(); const b=document.querySelector('[data-salvar]'); b && b.click(); } });

let itemAberto = null, apagarCat = null;
function renderItens(){
  const cods = Object.keys(st.cat).sort((a,b)=>st.cat[a].localeCompare(st.cat[b]) || a.localeCompare(b));
  $('contItens').textContent = cods.length ? '· '+cods.length : '';
  const q = $('buscaItem').value;
  const lista = q.trim() ? buscar(q).filter(it=>it.cod && st.cat[it.cod]).map(it=>it.cod) : cods;
  if (!cods.length){ $('listaItens').innerHTML = '<div class="empty">Nenhum item cadastrado.</div>'; }
  else if (!lista.length){ $('listaItens').innerHTML = '<div class="empty">Nenhum item encontrado.</div>'; }
  else $('listaItens').innerHTML = lista.map(c=>{
    const aberto = itemAberto===c;
    return `<li><div class="nm"><code class="cc">${esc(c)}</code><b style="margin-top:3px">${esc(st.cat[c])}</b></div>
      <button class="aj" data-it="${esc(c)}" aria-expanded="${aberto}" aria-label="Editar item">${aberto?'×':LAPIS}</button></li>`
      + (aberto ? `<li class="ajuste">
        <div class="grid2" style="flex:1 1 100%">
          <input id="itCod" type="search" enterkeyhint="done" class="code" value="${esc(c)}" aria-label="Codigo" autocomplete="off">
          <input id="fEdItem" type="search" enterkeyhint="done" name="f_ed_x" value="${esc(st.cat[c])}" autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
        <button class="danger ${apagarCat===c?'sure':''}" data-itdel>${apagarCat===c?'Toque de novo':'Excluir'}</button>
        <button class="big pri" data-itsalvar>Salvar</button></li>` : '');
  }).join('');
}
function novoItem(){
  const cod = $('novoCod').value.trim().toUpperCase(), nome = $('fNovoItem').value.trim();
  if (!cod || !nome){ toast('Preencha o codigo e o nome'); return; }
  if (st.cat[cod]){ toast('Esse codigo já existe'); return; }
  st.cat[cod] = nome;
  $('novoCod').value=''; $('fNovoItem').value='';
  salvar(); render(); toast('Item adicionado');
}
$('btnNovo').onclick = novoItem;
$('fNovoItem').addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); novoItem(); } });
$('novoCod').addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); $('fNovoItem').focus(); } });
$('buscaItem').addEventListener('input', ()=>{ itemAberto=null; renderItens(); });
$('listaItens').onclick = e=>{
  const b = e.target.closest('[data-it]');
  if (b){ itemAberto = itemAberto===b.dataset.it ? null : b.dataset.it; apagarCat=null; renderItens(); return; }
  const c = itemAberto; if (!c) return;
  if (e.target.closest('[data-itsalvar]')){
    const nc = $('itCod').value.trim().toUpperCase(), nn = $('fEdItem').value.trim();
    if (!nc || !nn){ toast('Preencha o codigo e o nome'); return; }
    if (nc!==c && st.cat[nc]){ toast('Esse codigo já existe'); return; }
    delete st.cat[c]; st.cat[nc] = nn;
    st.mov.forEach(x=>{ if (x.cod===c){ x.cod = nc; x.nome = nn; } });
    itemAberto=null; salvar(); render(); toast('Item atualizado');
    return;
  }
  if (e.target.closest('[data-itdel]')){
    if (apagarCat!==c){ apagarCat=c; renderItens(); return; }
    delete st.cat[c]; itemAberto=null; apagarCat=null; salvar(); render(); toast('Item excluído');
  }
};

let acao=null;
function confirmar(msg,fn){ $('confirmMsg').textContent=msg; acao=fn; $('confirmBox').hidden=false; $('confirmBox').scrollIntoView({behavior:'smooth',block:'center'}); }
$('confNao').onclick=()=>{ acao=null; $('confirmBox').hidden=true; };
$('confSim').onclick=()=>{ const f=acao; acao=null; $('confirmBox').hidden=true; if(f) f(); };

$('btnFechar').onclick = ()=>{
  const dia = diaAtual();
  if (!st.mov.some(x=>diaDe(x.t)===dia)){ toast('Nada para limpar'); return; }
  const nd = nomeDia(dia).toLowerCase();
  confirmar(`Limpar a lista de ${nd}? Os registros desse dia serão apagados.`, ()=>{
    st.mov = st.mov.filter(x=>diaDe(x.t)!==dia);
    diaSel=null; salvar(); render(); toast('Lista limpa');
  });
};

$('btnCopiar').onclick = ()=>{
  const dia = diaAtual();
  const g = agrupar(dia).filter(i=>i.saldo!==0);
  if (!g.length){ toast('Nada para copiar'); return; }
  const [y,m,d] = dia.split('-');
  const semana = new Date(+y,+m-1,+d).toLocaleDateString('pt-BR',{weekday:'long'});
  const linha = '──────────';
  const ent = g.filter(i=>i.saldo>0), sai = g.filter(i=>i.saldo<0);
  const larg = Math.max(...g.map(i=>String(Math.abs(i.saldo)).length)) + 1;
  const bloco = i=>{
    const n = ((i.saldo>0?'+':'-') + Math.abs(i.saldo)).padEnd(larg);
    const rec = ' '.repeat(larg + 5);
    if (i.cod && i.nome) return `  ${n}   ${i.cod}\n${rec}${i.nome}`;
    return `  ${n}   ${i.cod || i.nome}`;
  };
  let txt = `PARA LANÇAMENTO\n${semana.charAt(0).toUpperCase()+semana.slice(1)}, ${d}/${m}/${y}\n${linha}`;
  if (ent.length) txt += `\n\nENTRADAS\n` + ent.map(bloco).join('\n\n');
  if (sai.length) txt += `\n\nSAÍDAS\n` + sai.map(bloco).join('\n\n');
  const pl = (n,a,b)=>n+' '+(n===1?a:b);
  txt += `\n\n${linha}\n${pl(g.length,'item','itens')} · ${pl(ent.length,'entrada','entradas')} · ${pl(sai.length,'saída','saídas')}`;
  $('copiaCard').hidden = true;
  const mostrar = ()=>{ $('copiaTxt').value=txt; $('copiaCard').hidden=false; $('copiaTxt').select(); };
  try { navigator.clipboard.writeText(txt).then(()=>toast('Lista copiada'), mostrar); } catch(e){ mostrar(); }
};

let ultimoDia = hoje();
function checarDia(){ if (hoje()!==ultimoDia){ ultimoDia=hoje(); diaSel=null; render(); } }
setInterval(checarDia, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checarDia(); });

const areaRolagem = document.querySelector('main');
document.addEventListener('focusin', e=>{
  const el = e.target; if (!el.matches('input, textarea')) return;
  setTimeout(()=>{
    const caixa = areaRolagem.getBoundingClientRect();
    let alvo = el.closest('.card') || el;
    if (alvo.getBoundingClientRect().height > caixa.height * 0.8) alvo = el.closest('li') || el.parentElement;
    const escondido = (caixa.top + 8) - alvo.getBoundingClientRect().top;
    if (escondido > 0){
      const espaco = caixa.bottom - el.getBoundingClientRect().bottom - 8;
      const mover = Math.min(escondido, Math.max(0, espaco));
      if (mover > 0) areaRolagem.scrollBy({top: -mover, behavior: 'smooth'});
    }
    const abaixo = el.getBoundingClientRect().bottom - (caixa.bottom - 8);
    if (abaixo > 0) areaRolagem.scrollBy({top: abaixo, behavior: 'smooth'});
  }, 350);
});

if (window.visualViewport){
  const vv = window.visualViewport;
  const ajusta = ()=>{
    document.documentElement.style.setProperty('--apph', vv.height + 'px');
    if (window.scrollY || vv.offsetTop) window.scrollTo(0, 0);
  };
  vv.addEventListener('resize', ajusta); vv.addEventListener('scroll', ajusta);
  window.addEventListener('scroll', ()=>{ if (window.scrollY) window.scrollTo(0, 0); });
  ajusta();
}

render();

if ('serviceWorker' in navigator && location.protocol==='https:') {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
</script>
